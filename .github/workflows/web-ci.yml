# CI do web: lint, testes, E2E, Sonar (opcional) e imagem. O check obrigatorio e o job "web-gate".
# Lighthouse e deploy entram depois (Sprint 0b/1 final). Sonar: variavel SONAR_ENABLED=true + secret SONAR_TOKEN_WEB.
name: web-ci
on:
  pull_request: { branches: [develop] }
  push: { branches: [develop] }
permissions: { contents: read }
concurrency: { group: "web-ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs: { run: "${{ steps.f.outputs.web }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: f
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'api/openapi/**' # o cliente e gerado do contrato
              - '.github/workflows/web-ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run gen:api
      - run: npx biome ci ./src ./scripts ./e2e # formatacao + lint geral
      - run: npx eslint ./src # StyleX, tamanho/complexidade, imports entre features
      - run: npx tsc -b # tsc 7 (@typescript/native)
      - run: npm run check:i18n
      - run: npm run check:structure

  test-unit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run gen:api
      - run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text-summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: web-coverage, path: web/coverage/lcov.info }

  e2e: # Playwright: Chromium (Pixel 7), pt-BR, fuso fixo, specs por feature com mocks de API
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run gen:api
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: ~/.cache/ms-playwright, key: "pw-${{ hashFiles('web/package-lock.json') }}" }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test # o webServer do config faz o build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }

  sonar: # opcional: so roda com SONAR_ENABLED=true (variavel do repositorio) e SONAR_TOKEN_WEB (secret)
    needs: [changes, test-unit]
    if: vars.SONAR_ENABLED == 'true' && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: web-coverage, path: web/coverage }
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN_WEB }}" }
        with:
          projectBaseDir: web
          args: >
            -Dsonar.projectKey=keven-rdr_wordloop-web
            -Dsonar.organization=keven-rdr
            -Dsonar.sources=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=src/api/generated/**,src/routeTree.gen.ts,src/**/*.test.ts,src/**/*.test.tsx

  image: # so em push na develop com mudanca no web; UMA imagem, sem build-arg de ambiente
    if: github.event_name == 'push' && needs.changes.outputs.run == 'true'
    needs: [changes, lint, test-unit, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - id: v
        run: echo "version=$(git describe --tags --match 'web-v*' --always | sed 's/^web-v//')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: . # a raiz: o build gera o cliente a partir de api/openapi
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wordloop-web:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  web-gate:
    name: web-gate
    if: always()
    needs: [changes, lint, test-unit, e2e, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
