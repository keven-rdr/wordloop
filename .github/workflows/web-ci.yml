# Sprint 1: lint, testes, E2E e gate. Lighthouse, imagem, Sonar e deploy em tst entram depois (Sprint 0b/1 final).
name: web-ci
on:
  pull_request: { branches: [develop] }
  push: { branches: [develop] }
permissions: { contents: read }
concurrency: { group: "web-ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs: { run: "${{ steps.f.outputs.web }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: f
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'api/openapi/**'   # o cliente e gerado do contrato
              - '.github/workflows/web-ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run gen:api
      - run: npx biome ci ./src ./scripts ./e2e # formatacao + lint geral
      - run: npx eslint ./src # StyleX, tamanho/complexidade, imports entre features
      - run: npx tsc -b # tsc 7 (@typescript/native)
      - run: npm run check:i18n
      - run: npm run check:structure

  test-unit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run gen:api
      - run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text-summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: web-coverage, path: web/coverage/lcov.info }

  e2e: # Playwright: Chromium, pt-BR, fuso fixo, specs por feature com mocks de API
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run gen:api
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: ~/.cache/ms-playwright, key: "pw-${{ hashFiles('web/package-lock.json') }}" }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test # o webServer do config faz o build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }

  gate:
    if: always()
    needs: [changes, lint, test-unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
