# Deploy em tst (VM Oracle): chama o deploy.sh por SSH com as tags das imagens que o CI ja publicou no GHCR.
# Dois usos: MANUAL (workflow_dispatch, inclusive rollback) e AUTOMATICO (workflow_call, chamado por api-ci e web-ci
# depois do job `image`, so quando a variavel de repositorio DEPLOY_TST_ENABLED=true).
# Secrets DEPLOY_SSH_KEY, DEPLOY_HOST e DEPLOY_KNOWN_HOSTS (repositorio ou Environment `tst`).
# Tags: 'sha-<commit>' (ou '-' para manter a atual).
name: deploy
on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy ou rollback"
        type: choice
        options: [deploy, rollback]
        default: deploy
      api_tag: { description: "tag da API (sha-<commit>) ou -", default: "-" }
      web_tag: { description: "tag do web (sha-<commit>) ou -", default: "-" }
  workflow_call:
    inputs:
      action: { type: string, default: deploy }
      api_tag: { type: string, default: "-" }
      web_tag: { type: string, default: "-" }
permissions: { contents: read }
concurrency: { group: deploy-tst, cancel-in-progress: false }

jobs:
  tst:
    runs-on: ubuntu-latest
    environment: tst
    steps:
      - name: Prepara a chave SSH (host verificado, sem StrictHostKeyChecking=no)
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Executa o deploy.sh na VM (comando forcado)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          ACTION: ${{ inputs.action }}
          API_TAG: ${{ inputs.api_tag }}
          WEB_TAG: ${{ inputs.web_tag }}
        run: |
          if [ "$ACTION" = "rollback" ]; then CMD="rollback"; else CMD="$API_TAG $WEB_TAG"; fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "deploy@$HOST" "$CMD"
