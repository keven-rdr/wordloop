# Deploy em tst (VM Oracle), 100% automatico: monta o pacote de configuracao (compose, Caddyfile, api.env e o
# secrets.env com a DATABASE_URL do secret do GitHub) e o envia pela entrada padrao do SSH ao deploy.sh da VM,
# que migra o banco, atualiza as imagens e sobe a versao. Nada e gravado a mao na VM.
# Usos: AUTOMATICO (workflow_call: api-ci e web-ci chamam depois do job `image`, num push na develop; e push em
# deploy/tst ou deploy/scripts, que so atualiza a configuracao) e
# MANUAL (workflow_dispatch: escolher tags ou fazer rollback).
# Secrets (repositorio ou Environment `tst`): DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_KNOWN_HOSTS e DATABASE_URL;
# opcionais do login social: GOOGLE_CLIENT_ID/_SECRET, GH_OAUTH_CLIENT_ID/_SECRET (o GitHub nao deixa secret comecar com GITHUB_), OIDC_* e SESSION_KEY; do e-mail: BREVO_API_KEY.
# Tags: 'sha-<commit>' (ou '-' para manter a atual).
name: deploy
on:
  push: # configuracao do ambiente (Caddyfile, compose, scripts) vai sozinha para a VM, mantendo as versoes atuais
    branches: [develop]
    paths: ["deploy/tst/**", "deploy/scripts/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy ou rollback"
        type: choice
        options: [deploy, rollback]
        default: deploy
      api_tag: { description: "tag da API (sha-<commit>) ou -", default: "-" }
      web_tag: { description: "tag do web (sha-<commit>) ou -", default: "-" }
  workflow_call:
    inputs:
      action: { type: string, default: deploy }
      api_tag: { type: string, default: "-" }
      web_tag: { type: string, default: "-" }
permissions: { contents: read }
concurrency: { group: deploy-tst, cancel-in-progress: false }

jobs:
  tst:
    runs-on: ubuntu-latest
    environment: tst
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepara a chave SSH e o pacote de configuracao
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Login social (opcionais): cada grupo e tudo ou nada; com qualquer provedor, o SESSION_KEY e obrigatorio.
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          # E-mail (opcional): sem a chave, o cadastro e a recuperacao por e-mail ficam desligados (503).
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          for v in KEY KNOWN DATABASE_URL; do
            [ -n "${!v}" ] || { echo "::error::secret ausente ou vazio: $v (Settings > Secrets and variables > Actions > Secrets)"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" | tr -d '\r' > ~/.ssh/known_hosts
          install -d "$RUNNER_TEMP/pacote"
          cp deploy/tst/compose.yaml deploy/tst/Caddyfile deploy/tst/api.env deploy/scripts/deploy.sh "$RUNNER_TEMP/pacote/"
          providers=0
          group_ok() { # tudo ou nada: devolve 0 se o grupo esta completo, 1 se vazio; erro se pela metade
            local total=0 set=0 v; for v in "$@"; do total=$((total + 1)); if [ -n "${!v}" ]; then set=$((set + 1)); fi; done
            if [ "$set" -ne 0 ] && [ "$set" -ne "$total" ]; then echo "::error::grupo incompleto: defina todos ou nenhum de: $*" >&2; exit 1; fi
            [ "$set" -eq "$total" ]
          }
          emit() { local v; for v in "$@"; do printf '%s=%s\n' "$v" "$(printf '%s' "${!v}" | tr -d '\r\n')"; done; }
          {
            printf 'DATABASE_URL=%s\n' "$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
            if group_ok OIDC_ISSUER OIDC_CLIENT_ID OIDC_CLIENT_SECRET; then emit OIDC_ISSUER OIDC_CLIENT_ID OIDC_CLIENT_SECRET; providers=1; fi
            if group_ok GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; then emit GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; providers=1; fi
            if group_ok GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET; then emit GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET; providers=1; fi
            if [ -n "$SESSION_KEY" ]; then emit SESSION_KEY; fi
            if [ -n "$BREVO_API_KEY" ]; then printf 'BREVO_API_KEY=%s\n' "$(printf '%s' "$BREVO_API_KEY" | tr -d '[:space:]')"; fi
          } > "$RUNNER_TEMP/pacote/secrets.env"
          if [ "$providers" -eq 1 ] && [ -z "$SESSION_KEY" ]; then echo "::error::com login social, defina tambem o secret SESSION_KEY (openssl rand -base64 32)"; exit 1; fi
          tar -C "$RUNNER_TEMP/pacote" -cf "$RUNNER_TEMP/pacote.tar" compose.yaml Caddyfile api.env secrets.env deploy.sh
      - name: Executa o deploy.sh na VM (comando forcado)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          ACTION: ${{ inputs.action || 'deploy' }}
          API_TAG: ${{ inputs.api_tag || '-' }}
          WEB_TAG: ${{ inputs.web_tag || '-' }}
        run: |
          HOST="$(printf '%s' "$HOST" | tr -d '[:space:]')" # secret colado com espaco ou quebra de linha sobrando
          # Espaco na frente: um comando que comeca com "-" (tag "-" = manter) o ssh leria como opcao ("unknown option --").
          if [ "$ACTION" = "rollback" ]; then CMD="rollback"; else CMD=" $API_TAG $WEB_TAG"; fi
          set +e
          # 255 = falha do proprio ssh (conexao derrubada pelo sshd sob varredura de bots): o deploy.sh nem rodou, repetir e seguro.
          for tentativa in 1 2 3 4; do
            saida="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "deploy@$HOST" "$CMD" < "$RUNNER_TEMP/pacote.tar" 2>&1)"
            codigo=$?
            [ "$codigo" -ne 255 ] && break
            case "$saida" in *usage:*) break ;; esac # erro de uso do ssh nao melhora ao repetir
            echo "ssh falhou (255) na tentativa $tentativa: $(printf '%s' "$saida" | tail -n 1)"
            sleep $((tentativa * 10))
          done
          printf '%s\n' "$saida"
          if [ "$codigo" -ne 0 ]; then
            echo "::error title=deploy falhou (codigo $codigo)::$(printf '%s' "$saida" | tail -n 8 | tr '\n' ' ')"
          fi
          exit "$codigo"
