# CI da API: lint, testes, vulnerabilidades, Sonar (opcional) e imagem. O check obrigatorio e o job "api-gate".
# Imagem: so em push na develop, multi-arquitetura (amd64 + arm64: a VM da Oracle e ARM).
# Sonar: liga quando a variavel de repositorio SONAR_ENABLED=true e o secret SONAR_TOKEN_API existirem; SONAR_REQUIRED=true faz o api-gate FALHAR sem o quality gate aprovado (ver docs/ci-cd.md).
name: api-ci
on:
  pull_request: { branches: [develop] }
  push: { branches: [develop] }
permissions: { contents: read }
concurrency:
  group: "api-ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # push na develop (deploy) nunca e cancelado
env: { GO_VERSION: "1.27.x" }

jobs:
  changes: # filtro de caminho DENTRO do workflow: o check obrigatorio e o gate (passa se tudo foi OK ou pulado)
    runs-on: ubuntu-latest
    outputs: { run: "${{ steps.f.outputs.api }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: f
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/api-ci.yml'
              - 'VERSION' # a base da versao muda: reconstroi
              - 'scripts/app-version.sh'

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.mod }
      - run: go generate ./...
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.14.0 # MANTENHA IGUAL a GOLANGCI_LINT em scripts/check.mjs
          working-directory: api
      - run: go run ./scripts/check-structure
      - run: go install github.com/fe3dback/go-arch-lint@v1.19.0 && go-arch-lint check

  test-unit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.mod }
      - run: go generate ./...
      - run: go test -race -short -coverprofile=coverage-unit.out ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: api-coverage-unit, path: api/coverage-unit.out }

  test-integration: # Postgres REAL via Testcontainers (o runner tem Docker); nada de banco simulado
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.mod }
      - run: go generate ./...
      # -p 1: um pacote por vez. Varios pacotes sobem um Keycloak cada (e o Argon2id pesa); em paralelo, no runner
      # de 2 CPUs, eles disputam CPU e memoria e estouram os tempos-limite de partida. Sequencial e deterministico.
      - name: Testes de integracao (Postgres e Keycloak reais)
        run: |
          set -o pipefail
          go test -tags=integration -count=1 -p 1 -timeout 25m -coverprofile=coverage-int.out -coverpkg=./cmd/...,./internal/... ./... 2>&1 | tee test-int.log
      - name: Mostra qual teste falhou (anotacao do job)
        if: failure()
        run: |
          grep -E '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+' test-int.log | head -30 | while IFS= read -r linha; do echo "::error::${linha}"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: api-coverage-int, path: api/coverage-int.out }

  vuln:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "${{ env.GO_VERSION }}", check-latest: true, cache-dependency-path: api/go.mod }
      - run: go generate ./... # o govulncheck precisa do codigo gerado presente
      # Direto, sem a golang/govulncheck-action: ela faz o proprio checkout (apaga o codigo gerado) e instala @latest.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  sonar: # opcional: so roda com SONAR_ENABLED=true (variavel do repositorio) e SONAR_TOKEN_API (secret)
    needs: [changes, test-unit, test-integration]
    if: vars.SONAR_ENABLED == 'true' && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 } # o Sonar precisa do historico
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: api-coverage-unit, path: api }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: api-coverage-int, path: api }
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN_API }}" } # token SO por secret, nunca em build-arg
        with:
          projectBaseDir: api
          args: >
            -Dsonar.projectKey=keven-rdr_wordloop-api
            -Dsonar.organization=keven-rdr
            -Dsonar.go.coverage.reportPaths=coverage-unit.out,coverage-int.out
            -Dsonar.exclusions=**/gen/**,**/adapters/postgres/db/**,**/dbtest/**,**/identitytest/**,**/catalogtest/**,**/learningtest/**,**/*_test.go
            -Dsonar.cpd.exclusions=migrations/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  image: # so em push na develop com mudanca na API; a MESMA imagem e promovida entre ambientes (build uma vez)
    if: github.event_name == 'push' && needs.changes.outputs.run == 'true'
    needs: [changes, lint, test-unit, vuln]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - id: v
        run: echo "version=$(sh scripts/app-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wordloop-api:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy-tst: # automatico em todo push na develop com imagem nova (ver deploy.yml e docs/ci-cd.md)
    if: github.event_name == 'push'
    needs: image
    uses: ./.github/workflows/deploy.yml
    with: { api_tag: "sha-${{ github.sha }}", web_tag: "-" }
    secrets: inherit

  api-gate: # UNICO check obrigatorio da API na ruleset: passa se tudo foi OK ou pulado
    name: api-gate
    if: always()
    needs: [changes, lint, test-unit, test-integration, vuln, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
      - name: Sonar obrigatorio (quality gate aprovado)
        if: needs.changes.outputs.run == 'true' && vars.SONAR_REQUIRED == 'true' && needs.sonar.result != 'success'
        run: |
          echo "::error title=Sonar nao aprovou::SONAR_REQUIRED=true exige o job sonar verde (SONAR_ENABLED=true, token e quality gate aprovado). Resultado do job: ${{ needs.sonar.result }}"
          exit 1
