# Sprint 1: lint, testes e gate. Imagem, Sonar e deploy em tst entram quando VM, dominio e contas existirem (Sprint 0b).
name: api-ci
on:
  pull_request: { branches: [develop] }
  push: { branches: [develop] }
permissions: { contents: read }
concurrency: { group: "api-ci-${{ github.ref }}", cancel-in-progress: true }
env: { GO_VERSION: "1.27.x" }

jobs:
  changes: # filtro de caminho DENTRO do workflow: o check obrigatorio e o "gate"
    runs-on: ubuntu-latest
    outputs: { run: "${{ steps.f.outputs.api }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: f
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/api-ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.mod }
      - run: go generate ./...
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with: { working-directory: api }
      - run: go run ./scripts/check-structure
      - run: go install github.com/fe3dback/go-arch-lint@v1.19.0 && go-arch-lint check

  test-unit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.mod }
      - run: go generate ./...
      - run: go test -race -short -coverprofile=coverage-unit.out ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: api-coverage-unit, path: api/coverage-unit.out }

  vuln:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cd api && go generate ./...
        # o govulncheck-action precisa do codigo gerado presente para analisar os pacotes
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with: { work-dir: api, go-version-input: "${{ env.GO_VERSION }}", check-latest: true }

  gate: # UNICO check obrigatorio da API na ruleset: passa se tudo foi OK ou pulado
    if: always()
    needs: [changes, lint, test-unit, vuln]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
