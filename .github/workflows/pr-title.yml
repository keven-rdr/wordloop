# O merge e por squash: o TITULO da PR vira a mensagem do commit na develop e e o que o release-please le.
# Por isso o titulo precisa ser Conventional Commits. Check obrigatorio: "pr-title".
name: pr-title
on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]
permissions: { contents: read }

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: valida o titulo (Conventional Commits)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{3,100}$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
          else
            echo "::error title=Titulo da PR invalido::'$TITLE' deve seguir Conventional Commits, ex.: feat(api): adiciona endpoint de metas"
            exit 1
          fi
