# tst na VM Oracle Micro (1 GB de RAM): Caddy + API + web. Sem Postgres (Neon) e sem Keycloak (ainda).
# Na VM, em /srv/wordloop/tst: este arquivo, Caddyfile, versions.env e secrets.env (modo 600, nunca no Git).
# Usado pelo deploy.sh: docker compose --env-file versions.env up -d
name: wl-tst

volumes: { caddy_data: {}, caddy_config: {} }

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine
    read_only: false # o Caddy grava certificados em /data e /config (volumes)
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { TST_DOMAIN: "${TST_DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    depends_on: [api, web]

  api:
    <<: *hardening
    image: ghcr.io/keven-rdr/wordloop-api:${API_TAG}
    environment: { APP_ENV: tst, API_ADDR: ":8080" }
    env_file: [secrets.env] # DATABASE_URL, GOMEMLIMIT
    mem_limit: 128m

  web:
    <<: *hardening
    image: ghcr.io/keven-rdr/wordloop-web:${WEB_TAG}
    tmpfs: [/tmp]
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      retries: 3
