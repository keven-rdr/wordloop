# ESQUELETO (Fase 4): não está em .github/ ainda. Ações de terceiros: FIXAR POR SHA no Sprint 0.
name: api-ci
on:
  pull_request: { branches: [develop] }
  push:         { branches: [develop] }
permissions: { contents: read }
concurrency: { group: "api-ci-${{ github.ref }}", cancel-in-progress: true }
env: { GO_VERSION: "1.27.x" }

jobs:
  changes:                                   # filtro de caminho DENTRO do workflow (o check obrigatório é o "gate")
    runs-on: ubuntu-latest
    outputs: { run: "${{ steps.f.outputs.api }}" }
    steps:
      - uses: actions/checkout@v4            # fixar SHA
      - id: f
        uses: dorny/paths-filter@v3          # fixar SHA
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/api-ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5            # cache de módulos e de build automático
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.sum }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8   # depguard, funlen, cyclop, gosec...
        with: { working-directory: api }
      - run: go run ./scripts/check-structure   # arquivo <= 300 linhas, <= 12 arquivos/pacote, <= 60/módulo
      - run: go run github.com/fe3dback/go-arch-lint@v1.19.0 check
      - name: código gerado está em dia (OpenAPI + sqlc)
        run: |
          go generate ./...
          git diff --exit-code

  test-unit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.sum }
      - run: go test -race -short -coverprofile=coverage-unit.out ./...
      - uses: actions/upload-artifact@v4
        with: { name: api-coverage-unit, path: api/coverage-unit.out }

  test-integration:                          # Testcontainers: Postgres (e Keycloak no teste do BFF)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.sum }
      - run: go test -tags=integration -coverprofile=coverage-int.out ./...
      - uses: actions/upload-artifact@v4
        with: { name: api-coverage-int, path: api/coverage-int.out }

  vuln:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1   # fixar SHA
        with: { work-dir: api, go-version-input: "${{ env.GO_VERSION }}" }

  sonar:                                     # PR e push em develop (branch principal do projeto no Sonar)
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }             # o Sonar precisa do histórico
      - uses: actions/download-artifact@v4
        with: { path: api/coverage, pattern: "api-coverage-*", merge-multiple: true }
      - uses: SonarSource/sonarqube-scan-action@v4   # fixar SHA; token SÓ por secret
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN_API }}" }
        with:
          projectBaseDir: api
          args: >
            -Dsonar.projectKey=OWNER_wordloop-api
            -Dsonar.organization=OWNER
            -Dsonar.go.coverage.reportPaths=coverage/coverage-unit.out,coverage/coverage-int.out
            -Dsonar.exclusions=**/gen/**,**/db/**,**/*_test.go

  image:                                     # só em push na develop: constrói UMA vez; a mesma imagem é promovida
    if: github.event_name == 'push'
    needs: [lint, test-unit, test-integration, vuln]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: echo "version=$(git describe --tags --match 'api-v*' --always | sed 's/^api-v//')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wordloop-api:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
      - uses: aquasecurity/trivy-action@master   # fixar SHA; varre a imagem
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/wordloop-api:sha-${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  deploy-tst:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with: { env: tst, api_tag: "sha-${{ github.sha }}" }
    secrets: inherit

  gate:                                      # ÚNICO check obrigatório da API na ruleset: passa se tudo foi OK ou pulado
    if: always()
    needs: [changes, lint, test-unit, test-integration, vuln, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
