openapi: 3.0.3
info:
  title: wordloop API
  version: 0.1.0
  description: Fonte da verdade do contrato. O servidor Go e o cliente TypeScript sao gerados daqui.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: identity
  - name: catalog
paths:
  /version:
    get:
      tags: [meta]
      operationId: getVersion
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
  /health/ready:
    get:
      tags: [meta]
      operationId: getReadiness
      security: []
      responses:
        "200": { description: ok }
        "503": { description: banco de dados indisponivel }
  /auth/login:
    get:
      tags: [identity]
      operationId: startLogin
      description: >
        Inicia o login social (code + PKCE) e redireciona ao provedor. Sem `provider`, usa o provedor OIDC padrao.
        Quais provedores existem neste ambiente: `GET /auth/providers`.
      security: []
      parameters:
        - { name: provider, in: query, required: false, description: provedor de login, schema: { type: string, enum: [google, github, oidc] } }
        - { name: return_to, in: query, required: false, description: caminho relativo para voltar depois de entrar, schema: { type: string, maxLength: 512 } }
      responses:
        "302": { description: redireciona ao provedor de identidade }
        "400": { description: provedor desconhecido ou desligado neste ambiente }
        "503": { description: login nao configurado neste ambiente }
  /auth/providers:
    get:
      tags: [identity]
      operationId: listLoginProviders
      description: Provedores de login social ligados neste ambiente (a tela habilita so os botoes desta lista).
      security: []
      responses:
        "200":
          description: provedores ligados (lista vazia se nenhum)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginProviders" }
  /auth/callback:
    get:
      tags: [identity]
      operationId: finishLogin
      description: >
        Conclui o login social, cria a sessao (cookie httpOnly) e redireciona de volta ao app. Se algo falhar, a
        resposta tambem e um redirecionamento, para `/login?error=failed` (login invalido ou expirado),
        `/login?error=two_factor` (a conta exige 2 fatores e o provedor nao os comprovou) ou `/login?error=email`
        (o provedor nao informou um e-mail confirmado); nenhuma sessao e criada. So um e-mail confirmado pelo provedor
        vincula a uma conta existente ou cria uma conta nova.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302": { description: "redireciona ao app (sessao criada) ou a /login?error=... (falha)" }
        "503": { description: login nao configurado neste ambiente }
  /auth/logout:
    post:
      tags: [identity]
      operationId: logout
      description: Encerra a sessao atual e limpa o cookie.
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "204": { description: sessao encerrada }
        "400": { description: cabecalho de protecao ausente }
  /me:
    get:
      tags: [identity]
      operationId: getMe
      description: Perfil de quem esta logado.
      responses:
        "200":
          description: perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { description: sem sessao valida }
  /me/two-factor:
    put:
      tags: [identity]
      operationId: setTwoFactor
      description: >
        Liga ou desliga a exigencia de 2 fatores no login da propria conta. Vem desligada. Por enquanto so
        administradores podem mudar (os demais recebem 403). Ligar exige uma sessao que ja comprovou os 2 fatores
        (entrar com passkey vale), senao 409.
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTwoFactorRequest" }
      responses:
        "204": { description: opcao gravada }
        "400": { description: cabecalho de protecao ausente ou corpo invalido }
        "401": { description: sem sessao valida }
        "403": { description: a conta nao e de administrador }
        "409": { description: a sessao atual nao comprovou 2 fatores; entre com passkey e tente de novo }
  /me/sessions:
    get:
      tags: [identity]
      operationId: listSessions
      description: Sessoes abertas de quem esta logado (a atual vem com current=true).
      responses:
        "200":
          description: sessoes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "401": { description: sem sessao valida }
    delete:
      tags: [identity]
      operationId: revokeAllSessions
      description: Encerra todas as sessoes de quem esta logado, inclusive a atual ("sair de todos os aparelhos").
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "204": { description: sessoes encerradas e cookie limpo }
        "400": { description: cabecalho de protecao ausente }
        "401": { description: sem sessao valida }
  /me/sessions/{id}:
    delete:
      tags: [identity]
      operationId: revokeSession
      description: Encerra uma sessao de quem esta logado. Id de sessao de outra pessoa responde 404, como se nao existisse.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "204": { description: sessao encerrada (se era a atual, o cookie e limpo) }
        "400": { description: cabecalho de protecao ausente ou id invalido }
        "401": { description: sem sessao valida }
        "404": { description: sessao nao encontrada }
  /auth/password/login:
    post:
      tags: [identity]
      operationId: loginWithPassword
      description: >
        Entra com e-mail e senha e abre a sessao (cookie httpOnly). Qualquer recusa (e-mail inexistente, senha errada,
        conta bloqueada por tentativas) responde 401 igual, para nao revelar quais e-mails existem. Depois de 5 erros
        seguidos a conta fica bloqueada por um tempo crescente (ate 15 minutos). Conta que ligou o 2FA nao entra so
        com senha: 403 depois de a senha estar certa.
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordLoginRequest" }
      responses:
        "204": { description: sessao aberta (Set-Cookie) }
        "400": { description: cabecalho de protecao ausente ou corpo invalido }
        "401": { description: e-mail ou senha incorretos }
        "403": { description: a conta exige 2 fatores; entre com a passkey }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: login por senha indisponivel neste ambiente }
  /auth/register:
    post:
      tags: [identity]
      operationId: registerAccount
      description: >
        Pede o cadastro por e-mail. A resposta e sempre 202, exista ou nao uma conta com esse e-mail: quem e novo recebe
        o link de confirmacao (24 horas); quem ja tem conta recebe um aviso com o caminho para entrar ou redefinir a
        senha. Contas de administrador nao recebem e-mail. No maximo 1 e-mail por minuto e 5 por hora por conta.
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: pedido recebido (sem dizer se o e-mail ja existia) }
        "400": { description: cabecalho de protecao ausente, corpo invalido ou e-mail mal formado }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: cadastro por e-mail indisponivel neste ambiente (sem servico de e-mail) }
  /auth/password/forgot:
    post:
      tags: [identity]
      operationId: requestPasswordReset
      description: >
        Pede o link para redefinir a senha (30 minutos). A resposta e sempre 202. So contas de aluno com e-mail
        confirmado recebem o link; o administrador se recupera pelo servidor, nunca por e-mail.
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: pedido recebido (sem dizer se o e-mail existe) }
        "400": { description: cabecalho de protecao ausente, corpo invalido ou e-mail mal formado }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: recuperacao por e-mail indisponivel neste ambiente (sem servico de e-mail) }
  /auth/password/set:
    post:
      tags: [identity]
      operationId: setPassword
      description: >
        Define a senha com um token de uso unico e abre a sessao: o convite do admin (15 minutos), a confirmacao de
        e-mail do cadastro (24 horas) ou a recuperacao de senha (30 minutos). Confirmacao e recuperacao tambem marcam o
        e-mail como confirmado, e trocar a senha encerra as outras sessoes. A senha precisa ter de 12 a 128 caracteres,
        nao ser igual ao e-mail e nao ser um caractere repetido.
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPasswordRequest" }
      responses:
        "204": { description: "senha gravada e convite consumido; abre a sessao (Set-Cookie), exceto em conta que exige 2 fatores" }
        "400": { description: cabecalho de protecao ausente ou corpo invalido }
        "401": { description: o token nao vale mais (usado, vencido ou desconhecido) }
        "422": { description: "senha fraca (tamanho, igual ao e-mail ou repetida)" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: login por senha indisponivel neste ambiente }
  /auth/passkeys/register/begin:
    post:
      tags: [identity]
      operationId: beginPasskeyRegistration
      description: >
        Inicia o registro de uma passkey. Sem sessao, exige o convite emitido por `api create-admin` (campo `invite`);
        com sessao, adiciona outra passkey a propria conta. Devolve as opcoes para `navigator.credentials.create` e
        guarda o desafio (uso unico, 5 minutos) em cookie httpOnly.
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeginPasskeyRegistrationRequest" }
      responses:
        "200":
          description: opcoes do registro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "400": { description: cabecalho de protecao ausente ou corpo invalido }
        "401": { description: sem convite valido nem sessao }
        "409": { description: limite de passkeys por conta atingido }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: passkeys nao configuradas neste ambiente }
  /auth/passkeys/register/finish:
    post:
      tags: [identity]
      operationId: finishPasskeyRegistration
      description: >
        Conclui o registro: valida a resposta do aparelho (com verificacao do usuario), grava a chave publica e, se o
        registro veio de um convite, consome o convite e ja abre a sessao (cookie httpOnly).
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishPasskeyRegistrationRequest" }
      responses:
        "201":
          description: passkey registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { description: cabecalho ausente, corpo invalido, desafio expirado ou resposta do aparelho recusada }
        "401": { description: o convite nao vale mais }
        "409": { description: passkey ja cadastrada ou limite atingido }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: passkeys nao configuradas neste ambiente }
  /auth/passkeys/login/begin:
    post:
      tags: [identity]
      operationId: beginPasskeyLogin
      description: Inicia o login por passkey, sem digitar usuario (o aparelho mostra as passkeys deste site).
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200":
          description: opcoes do login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "400": { description: cabecalho de protecao ausente }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: passkeys nao configuradas neste ambiente }
  /auth/passkeys/login/finish:
    post:
      tags: [identity]
      operationId: finishPasskeyLogin
      description: "Conclui o login: valida a assinatura e a verificacao do usuario e abre a sessao (cookie httpOnly)."
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishPasskeyLoginRequest" }
      responses:
        "204": { description: sessao criada }
        "400": { description: cabecalho ausente ou corpo invalido }
        "401": { description: passkey nao reconhecida, desafio expirado ou resposta recusada }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: passkeys nao configuradas neste ambiente }
  /me/passkeys:
    get:
      tags: [identity]
      operationId: listPasskeys
      description: Passkeys de quem esta logado.
      responses:
        "200":
          description: passkeys
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
        "401": { description: sem sessao valida }
  /me/passkeys/{id}:
    delete:
      tags: [identity]
      operationId: deletePasskey
      description: >
        Apaga uma passkey de quem esta logado. Nunca deixa a conta sem forma de entrar, e o admin nunca fica sem
        passkey. Id de outra pessoa responde 404, como se nao existisse.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "204": { description: passkey apagada }
        "400": { description: cabecalho de protecao ausente ou id invalido }
        "401": { description: sem sessao valida }
        "404": { description: passkey nao encontrada }
        "409": { description: a conta ficaria sem forma de entrar }
  /catalog/units:
    get:
      tags: [catalog]
      operationId: listUnits
      description: Unidades tematicas do curso, com a quantidade de itens que quem pergunta pode ver.
      responses:
        "200":
          description: unidades em ordem
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CatalogUnit" } }
        "401": { description: sem sessao valida }
  /catalog/items:
    get:
      tags: [catalog]
      operationId: listItems
      description: >
        Palavras, expressoes e frases do curso, paginadas (page a partir de 1). Itens em rascunho so aparecem para
        administradores (com status=draft); os demais veem so o publicado.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: sort, in: query, schema: { type: string, enum: ["term,asc", "term,desc", "cefr,asc", "cefr,desc"], default: "term,asc" } }
        - { name: q, in: query, description: "busca no termo e na traducao", schema: { type: string, maxLength: 100 } }
        - { name: unit, in: query, schema: { type: string, format: uuid } }
        - { name: cefr, in: query, schema: { type: string, enum: [A1, A2, B1, B2, C1, C2] } }
        - { name: kind, in: query, schema: { type: string, enum: [word, expression, phrasal_verb, sentence] } }
        - { name: locale, in: query, description: "idioma da traducao; o padrao e pt-BR", schema: { type: string, enum: [pt-BR, en-US], default: pt-BR } }
      responses:
        "200":
          description: uma pagina de itens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { description: parametro invalido }
        "401": { description: sem sessao valida }
  /catalog/items/{id}:
    get:
      tags: [catalog]
      operationId: getItem
      description: Um item com exemplos, imagens (com credito) e itens relacionados. Rascunho para quem nao e administrador responde 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: locale, in: query, schema: { type: string, enum: [pt-BR, en-US], default: pt-BR } }
      responses:
        "200":
          description: o item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "400": { description: id ou parametro invalido }
        "401": { description: sem sessao valida }
        "404": { description: item nao encontrado }
  /catalog/credits:
    get:
      tags: [catalog]
      operationId: listCredits
      description: Fontes e licencas do conteudo, com o texto de credito exigido por cada licenca. Publico.
      security: []
      responses:
        "200":
          description: fontes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Credit" } }
components:
  responses:
    TooManyRequests:
      description: muitas tentativas; tente de novo depois do tempo de Retry-After
      headers:
        Retry-After: { schema: { type: integer }, description: segundos }
  parameters:
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      description: protecao contra CSRF (so o JavaScript do proprio app envia este cabecalho)
      schema: { type: string, enum: [XMLHttpRequest] }
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: wl_session, description: "com HTTPS o nome real e __Host-wl_session" }
  schemas:
    Me:
      type: object
      required: [id, display_name, role, two_factor_enabled]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        picture_url: { type: string, format: uri, description: "foto de perfil do login social (https); ausente quando nao ha" }
        two_factor_enabled: { type: boolean, description: "se a conta exige 2 fatores para entrar (desligado por padrao)" }
        role: { type: string, enum: [user, admin], description: "so informativo para a interface; a API confere o papel no banco a cada pedido" }
    PasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 1024 }
    LoginProviders:
      type: object
      required: [providers]
      properties:
        providers: { type: array, items: { type: string, enum: [google, github, oidc] } }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        locale: { type: string, enum: [pt-BR, en-US], description: "idioma do e-mail; o padrao e pt-BR" }
    SetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 256, description: "segredo do link (o que vem depois do # do convite, da confirmacao de e-mail ou da recuperacao)" }
        password: { type: string, maxLength: 1024 }
    SetTwoFactorRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    BeginPasskeyRegistrationRequest:
      type: object
      properties:
        invite: { type: string, maxLength: 256, description: "segredo do convite (o que vem depois do # do link)" }
    PasskeyOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true
          description: opcoes WebAuthn em JSON, no formato aceito por PublicKeyCredential.parse...OptionsFromJSON
          x-go-type: json.RawMessage
    FinishPasskeyRegistrationRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: resposta do aparelho (PublicKeyCredential.toJSON())
          x-go-type: json.RawMessage
        name: { type: string, maxLength: 200, description: "nome amigavel da passkey (ex.: Meu celular)" }
    FinishPasskeyLoginRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: resposta do aparelho (PublicKeyCredential.toJSON())
          x-go-type: json.RawMessage
    Passkey:
      type: object
      required: [id, name, created_at, backup_eligible]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        backup_eligible: { type: boolean, description: "passkey que o provedor do aparelho pode sincronizar" }
    Session:
      type: object
      required: [id, created_at, last_used_at, current]
      properties:
        id: { type: string, format: uuid, description: "identificador publico da sessao (nao e o segredo do cookie)" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        user_agent: { type: string }
        current: { type: boolean }
    CatalogUnit:
      type: object
      required: [id, position, theme_key, item_count]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        theme_key: { type: string, description: "chave de traducao do tema; a tela traduz" }
        item_count: { type: integer }
    ItemSummary:
      type: object
      required: [id, kind, term, status]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [word, expression, phrasal_verb, sentence] }
        term: { type: string }
        gloss: { type: string }
        cefr: { type: string, enum: [A1, A2, B1, B2, C1, C2] }
        unit_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, reviewed, published, retired] }
        image_url: { type: string }
    ItemPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ItemSummary" } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    ItemExample:
      type: object
      required: [text]
      properties:
        text: { type: string }
        translation: { type: string }
    ItemImage:
      type: object
      required: [url, credit]
      properties:
        url: { type: string }
        credit: { type: string }
    RelatedItem:
      type: object
      required: [id, term, type]
      properties:
        id: { type: string, format: uuid }
        term: { type: string }
        gloss: { type: string }
        type: { type: string, enum: [collocation, family, synonym, antonym, hypernym, contrast, related] }
    ItemDetail:
      type: object
      required: [id, kind, term, status, examples, images, related]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [word, expression, phrasal_verb, sentence] }
        term: { type: string }
        gloss: { type: string }
        cefr: { type: string, enum: [A1, A2, B1, B2, C1, C2] }
        unit_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, reviewed, published, retired] }
        examples: { type: array, items: { $ref: "#/components/schemas/ItemExample" } }
        images: { type: array, items: { $ref: "#/components/schemas/ItemImage" } }
        related: { type: array, items: { $ref: "#/components/schemas/RelatedItem" } }
    Credit:
      type: object
      required: [code, name, license, notice]
      properties:
        code: { type: string }
        name: { type: string }
        url: { type: string }
        license: { type: string, description: "identificador SPDX" }
        notice: { type: string, description: "texto de credito exigido pela licenca" }
    Version:
      type: object
      required: [api, commit, env]
      properties:
        api: { type: string, example: "0.1.0" }
        commit: { type: string, example: "a1b2c3d" }
        env: { type: string, example: "tst" }
