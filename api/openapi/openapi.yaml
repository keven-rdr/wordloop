openapi: 3.0.3
info:
  title: wordloop API
  version: 0.1.0
  description: Fonte da verdade do contrato. O servidor Go e o cliente TypeScript sao gerados daqui.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: identity
  - name: catalog
  - name: learning
  - name: progress
  - name: privacy
paths:
  /version:
    get:
      tags: [meta]
      operationId: getVersion
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
  /health/ready:
    get:
      tags: [meta]
      operationId: getReadiness
      security: []
      responses:
        "200": { description: ok }
        "503": { description: banco de dados indisponivel }
  /auth/login:
    get:
      tags: [identity]
      operationId: startLogin
      description: >
        Inicia o login social (code + PKCE) e redireciona ao provedor. Sem `provider`, usa o provedor OIDC padrao.
        Quais provedores existem neste ambiente: `GET /auth/providers`.
      security: []
      parameters:
        - { name: provider, in: query, required: false, description: provedor de login, schema: { type: string, enum: [google, github, oidc] } }
        - { name: return_to, in: query, required: false, description: caminho relativo para voltar depois de entrar, schema: { type: string, maxLength: 512 } }
      responses:
        "302": { description: redireciona ao provedor de identidade }
        "400": { description: provedor desconhecido ou desligado neste ambiente }
        "503": { description: login nao configurado neste ambiente }
  /auth/providers:
    get:
      tags: [identity]
      operationId: listLoginProviders
      description: Provedores de login social ligados neste ambiente (a tela habilita so os botoes desta lista).
      security: []
      responses:
        "200":
          description: provedores ligados (lista vazia se nenhum)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginProviders" }
  /auth/callback:
    get:
      tags: [identity]
      operationId: finishLogin
      description: >
        Conclui o login social, cria a sessao (cookie httpOnly) e redireciona de volta ao app. Se algo falhar, a
        resposta tambem e um redirecionamento, para `/login?error=failed` (login invalido ou expirado),
        `/login?error=two_factor` (a conta exige 2 fatores e o provedor nao os comprovou) ou `/login?error=email`
        (o provedor nao informou um e-mail confirmado); nenhuma sessao e criada. So um e-mail confirmado pelo provedor
        vincula a uma conta existente ou cria uma conta nova.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302": { description: "redireciona ao app (sessao criada) ou a /login?error=... (falha)" }
        "503": { description: login nao configurado neste ambiente }
  /auth/logout:
    post:
      tags: [identity]
      operationId: logout
      description: Encerra a sessao atual e limpa o cookie.
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "204": { description: sessao encerrada }
        "400": { description: cabecalho de protecao ausente }
  /me:
    get:
      tags: [identity]
      operationId: getMe
      description: Perfil de quem esta logado.
      responses:
        "200":
          description: perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { description: sem sessao valida }
  /me/settings:
    get:
      tags: [learning]
      operationId: getSettings
      description: >
        Preferencias da pessoa: idioma da interface, tema e fuso horario. O fuso define a virada do dia de estudo
        (com o corte de 04:00). Na primeira leitura criam-se os padroes (idioma e tema do sistema, fuso do aparelho).
      responses:
        "200":
          description: as preferencias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { description: sem sessao valida }
    put:
      tags: [learning]
      operationId: updateSettings
      description: >
        Grava as preferencias (o corpo inteiro). Com tz_auto = true o fuso acompanha o aparelho: o app envia o fuso
        detectado e o plano de estudo o atualiza quando o aparelho muda. Com tz_auto = false o fuso escolhido fica
        fixo e o aparelho nao o altera mais.
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: as preferencias gravadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { description: cabecalho de protecao ausente, fuso desconhecido ou valor fora das opcoes }
        "401": { description: sem sessao valida }
  /me/export:
    get:
      tags: [privacy]
      operationId: exportMyData
      description: >
        Todos os dados da pessoa em um JSON para baixar (LGPD, acesso e portabilidade): perfil, vinculos de login,
        passkeys (nome e datas), sessoes (aparelho e datas), preferencias, metas, dias de estudo, sessoes de estudo,
        cartoes e o log de revisoes inteiro. Nunca traz segredo: hash de senha, chave publica de passkey, tokens e
        hashes de sessao ficam de fora.
      responses:
        "200":
          description: os dados, como arquivo
          headers:
            Content-Disposition:
              description: o nome do arquivo para baixar (wordloop-dados-AAAA-MM-DD.json)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportData" }
        "401": { description: sem sessao valida }
  /me/erase:
    post:
      tags: [privacy]
      operationId: eraseMyAccount
      description: >
        Apaga a conta e todos os dados da pessoa, na hora e sem volta (LGPD, eliminacao): perfil, vinculos de login,
        passkeys, sessoes, preferencias, metas, estudo e o log de revisoes. Fica so um registro sem dado pessoal de
        que houve exclusao. Exige a confirmacao igual ao e-mail da conta e um login recente (ate 15 minutos).
        Contas de administrador nao se apagam por aqui.
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EraseRequest" }
      responses:
        "204": { description: conta apagada (a sessao deixa de existir; o app deve chamar logout para limpar o cookie) }
        "400": { description: cabecalho de protecao ausente ou confirmacao diferente do e-mail da conta }
        "401": { description: sem sessao valida }
        "403": { description: conta de administrador }
        "428": { description: "login antigo demais, entre de novo e repita" }
  /me/two-factor:
    put:
      tags: [identity]
      operationId: setTwoFactor
      description: >
        Liga ou desliga a exigencia de 2 fatores no login da propria conta. Vem desligada. Por enquanto so
        administradores podem mudar (os demais recebem 403). Ligar exige uma sessao que ja comprovou os 2 fatores
        (entrar com passkey vale), senao 409.
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTwoFactorRequest" }
      responses:
        "204": { description: opcao gravada }
        "400": { description: cabecalho de protecao ausente ou corpo invalido }
        "401": { description: sem sessao valida }
        "403": { description: a conta nao e de administrador }
        "409": { description: a sessao atual nao comprovou 2 fatores; entre com passkey e tente de novo }
  /me/sessions:
    get:
      tags: [identity]
      operationId: listSessions
      description: Sessoes abertas de quem esta logado (a atual vem com current=true).
      responses:
        "200":
          description: sessoes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "401": { description: sem sessao valida }
    delete:
      tags: [identity]
      operationId: revokeAllSessions
      description: Encerra todas as sessoes de quem esta logado, inclusive a atual ("sair de todos os aparelhos").
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "204": { description: sessoes encerradas e cookie limpo }
        "400": { description: cabecalho de protecao ausente }
        "401": { description: sem sessao valida }
  /me/sessions/{id}:
    delete:
      tags: [identity]
      operationId: revokeSession
      description: Encerra uma sessao de quem esta logado. Id de sessao de outra pessoa responde 404, como se nao existisse.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "204": { description: sessao encerrada (se era a atual, o cookie e limpo) }
        "400": { description: cabecalho de protecao ausente ou id invalido }
        "401": { description: sem sessao valida }
        "404": { description: sessao nao encontrada }
  /auth/password/login:
    post:
      tags: [identity]
      operationId: loginWithPassword
      description: >
        Entra com e-mail e senha e abre a sessao (cookie httpOnly). Qualquer recusa (e-mail inexistente, senha errada,
        conta bloqueada por tentativas) responde 401 igual, para nao revelar quais e-mails existem. Depois de 5 erros
        seguidos a conta fica bloqueada por um tempo crescente (ate 15 minutos). Conta que ligou o 2FA nao entra so
        com senha: 403 depois de a senha estar certa.
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordLoginRequest" }
      responses:
        "204": { description: sessao aberta (Set-Cookie) }
        "400": { description: cabecalho de protecao ausente ou corpo invalido }
        "401": { description: e-mail ou senha incorretos }
        "403": { description: a conta exige 2 fatores; entre com a passkey }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: login por senha indisponivel neste ambiente }
  /auth/register:
    post:
      tags: [identity]
      operationId: registerAccount
      description: >
        Pede o cadastro por e-mail. A resposta e sempre 202, exista ou nao uma conta com esse e-mail: quem e novo recebe
        o link de confirmacao (24 horas); quem ja tem conta recebe um aviso com o caminho para entrar ou redefinir a
        senha. Contas de administrador nao recebem e-mail. No maximo 1 e-mail por minuto e 5 por hora por conta.
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: pedido recebido (sem dizer se o e-mail ja existia) }
        "400": { description: cabecalho de protecao ausente, corpo invalido ou e-mail mal formado }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: cadastro por e-mail indisponivel neste ambiente (sem servico de e-mail) }
  /auth/password/forgot:
    post:
      tags: [identity]
      operationId: requestPasswordReset
      description: >
        Pede o link para redefinir a senha (30 minutos). A resposta e sempre 202. So contas de aluno com e-mail
        confirmado recebem o link; o administrador se recupera pelo servidor, nunca por e-mail.
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: pedido recebido (sem dizer se o e-mail existe) }
        "400": { description: cabecalho de protecao ausente, corpo invalido ou e-mail mal formado }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: recuperacao por e-mail indisponivel neste ambiente (sem servico de e-mail) }
  /auth/password/set:
    post:
      tags: [identity]
      operationId: setPassword
      description: >
        Define a senha com um token de uso unico e abre a sessao: o convite do admin (15 minutos), a confirmacao de
        e-mail do cadastro (24 horas) ou a recuperacao de senha (30 minutos). Confirmacao e recuperacao tambem marcam o
        e-mail como confirmado, e trocar a senha encerra as outras sessoes. A senha precisa ter de 12 a 128 caracteres,
        nao ser igual ao e-mail e nao ser um caractere repetido.
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPasswordRequest" }
      responses:
        "204": { description: "senha gravada e convite consumido; abre a sessao (Set-Cookie), exceto em conta que exige 2 fatores" }
        "400": { description: cabecalho de protecao ausente ou corpo invalido }
        "401": { description: o token nao vale mais (usado, vencido ou desconhecido) }
        "422": { description: "senha fraca (tamanho, igual ao e-mail ou repetida)" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: login por senha indisponivel neste ambiente }
  /auth/passkeys/register/begin:
    post:
      tags: [identity]
      operationId: beginPasskeyRegistration
      description: >
        Inicia o registro de uma passkey. Sem sessao, exige o convite emitido por `api create-admin` (campo `invite`);
        com sessao, adiciona outra passkey a propria conta. Devolve as opcoes para `navigator.credentials.create` e
        guarda o desafio (uso unico, 5 minutos) em cookie httpOnly.
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeginPasskeyRegistrationRequest" }
      responses:
        "200":
          description: opcoes do registro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "400": { description: cabecalho de protecao ausente ou corpo invalido }
        "401": { description: sem convite valido nem sessao }
        "409": { description: limite de passkeys por conta atingido }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: passkeys nao configuradas neste ambiente }
  /auth/passkeys/register/finish:
    post:
      tags: [identity]
      operationId: finishPasskeyRegistration
      description: >
        Conclui o registro: valida a resposta do aparelho (com verificacao do usuario), grava a chave publica e, se o
        registro veio de um convite, consome o convite e ja abre a sessao (cookie httpOnly).
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishPasskeyRegistrationRequest" }
      responses:
        "201":
          description: passkey registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { description: cabecalho ausente, corpo invalido, desafio expirado ou resposta do aparelho recusada }
        "401": { description: o convite nao vale mais }
        "409": { description: passkey ja cadastrada ou limite atingido }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: passkeys nao configuradas neste ambiente }
  /auth/passkeys/login/begin:
    post:
      tags: [identity]
      operationId: beginPasskeyLogin
      description: Inicia o login por passkey, sem digitar usuario (o aparelho mostra as passkeys deste site).
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "200":
          description: opcoes do login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "400": { description: cabecalho de protecao ausente }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: passkeys nao configuradas neste ambiente }
  /auth/passkeys/login/finish:
    post:
      tags: [identity]
      operationId: finishPasskeyLogin
      description: "Conclui o login: valida a assinatura e a verificacao do usuario e abre a sessao (cookie httpOnly)."
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishPasskeyLoginRequest" }
      responses:
        "204": { description: sessao criada }
        "400": { description: cabecalho ausente ou corpo invalido }
        "401": { description: passkey nao reconhecida, desafio expirado ou resposta recusada }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: passkeys nao configuradas neste ambiente }
  /me/passkeys:
    get:
      tags: [identity]
      operationId: listPasskeys
      description: Passkeys de quem esta logado.
      responses:
        "200":
          description: passkeys
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
        "401": { description: sem sessao valida }
  /me/passkeys/{id}:
    delete:
      tags: [identity]
      operationId: deletePasskey
      description: >
        Apaga uma passkey de quem esta logado. Nunca deixa a conta sem forma de entrar, e o admin nunca fica sem
        passkey. Id de outra pessoa responde 404, como se nao existisse.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "204": { description: passkey apagada }
        "400": { description: cabecalho de protecao ausente ou id invalido }
        "401": { description: sem sessao valida }
        "404": { description: passkey nao encontrada }
        "409": { description: a conta ficaria sem forma de entrar }
  /catalog/units:
    get:
      tags: [catalog]
      operationId: listUnits
      description: Unidades tematicas do curso, com a quantidade de itens que quem pergunta pode ver.
      responses:
        "200":
          description: unidades em ordem
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CatalogUnit" } }
        "401": { description: sem sessao valida }
  /catalog/items:
    get:
      tags: [catalog]
      operationId: listItems
      description: >
        Palavras, expressoes e frases do curso, paginadas (page a partir de 1). Itens em rascunho so aparecem para
        administradores (com status=draft); os demais veem so o publicado.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: sort, in: query, schema: { type: string, enum: ["term,asc", "term,desc", "cefr,asc", "cefr,desc"], default: "term,asc" } }
        - { name: q, in: query, description: "busca no termo e na traducao", schema: { type: string, maxLength: 100 } }
        - { name: unit, in: query, schema: { type: string, format: uuid } }
        - { name: cefr, in: query, schema: { type: string, enum: [A1, A2, B1, B2, C1, C2] } }
        - { name: kind, in: query, schema: { type: string, enum: [word, expression, phrasal_verb, sentence] } }
        - { name: locale, in: query, description: "idioma da traducao; o padrao e pt-BR", schema: { type: string, enum: [pt-BR, en-US], default: pt-BR } }
      responses:
        "200":
          description: uma pagina de itens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { description: parametro invalido }
        "401": { description: sem sessao valida }
  /catalog/items/{id}:
    get:
      tags: [catalog]
      operationId: getItem
      description: Um item com exemplos, imagens (com credito) e itens relacionados. Rascunho para quem nao e administrador responde 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: locale, in: query, schema: { type: string, enum: [pt-BR, en-US], default: pt-BR } }
      responses:
        "200":
          description: o item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "400": { description: id ou parametro invalido }
        "401": { description: sem sessao valida }
        "404": { description: item nao encontrado }
  /catalog/credits:
    get:
      tags: [catalog]
      operationId: listCredits
      description: Fontes e licencas do conteudo, com o texto de credito exigido por cada licenca. Publico.
      security: []
      responses:
        "200":
          description: fontes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Credit" } }
  /study/plan:
    post:
      tags: [learning]
      operationId: planSession
      description: >
        Monta a sessao de estudo para "quanto tempo hoje?": as revisoes vencidas (menor retencao primeiro, ate o
        limite do tempo) e as palavras novas (minutos / 5, ate 8; nenhuma se a fila de revisoes passar de 2x o
        limite). Palavras novas ganham o cartao receptivo aqui; o produtivo nasce quando o receptivo chega a S >= 7 d.
        Itens em rascunho so entram para administradores. O pacote traz o conteudo, para estudar sem rede.
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "200":
          description: o pacote de cartoes da sessao
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyPack" }
        "400": { description: cabecalho de protecao ausente ou corpo invalido }
        "401": { description: sem sessao valida }
  /study/reviews:
    post:
      tags: [learning]
      operationId: submitReviews
      description: >
        Envia respostas em lote (ate 200). Cada uma traz um UUID gerado no cliente: reenviar o mesmo UUID nao muda
        nada (status duplicate). O servidor refaz a correcao (digitar: compara com o termo; escolher: confere o item),
        calcula a nota e o novo estado do cartao e grava no log imutavel; o client_correct do cliente so e registrado.
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewBatch" }
      responses:
        "200":
          description: resultado de cada resposta, na mesma ordem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewBatchResult" }
        "400": { description: cabecalho de protecao ausente, lote vazio ou grande demais, ou corpo invalido }
        "401": { description: sem sessao valida }
  /progress/dashboard:
    get:
      tags: [progress]
      operationId: getDashboard
      description: >
        Painel de progresso da pessoa: sequencia de dias, acertos dos ultimos 7 dias, o que ja fez hoje, previsao
        de revisoes dos proximos 7 dias, palavras conhecidas e as mais erradas do ultimo mes. O dia de estudo
        segue o fuso e o corte de hora da pessoa; "estudou no dia" e ter respondido ao menos 1 vez.
      parameters:
        - { name: locale, in: query, description: "idioma da traducao das palavras", schema: { type: string, enum: [pt-BR, en-US], default: pt-BR } }
      responses:
        "200":
          description: o painel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { description: sem sessao valida }
  /progress/heatmap:
    get:
      tags: [progress]
      operationId: getHeatmap
      description: >
        Dias em que a pessoa estudou, com respostas e acertos (dias sem estudo nao aparecem). Sem from e to, traz as
        ultimas 12 semanas ate hoje. O intervalo vai ate 400 dias.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: dias com estudo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Heatmap" }
        "400": { description: intervalo invalido (de depois de ate, ou maior que 400 dias) }
        "401": { description: sem sessao valida }
  /goals/current:
    get:
      tags: [progress]
      operationId: getCurrentGoal
      description: >
        A meta do ciclo e o quanto ja foi cumprido. O ciclo dura 7 dias a partir de quando foi aberto. Passado o
        fim (ended = true), o progresso e a retrospectiva do ciclo e a meta continua valendo ate a pessoa abrir
        outra: nao responder nunca bloqueia o estudo. Sem meta ainda, vem so ended = false.
      responses:
        "200":
          description: a meta atual (ausente se nunca houve)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentGoal" }
        "401": { description: sem sessao valida }
  /goals/suggestions:
    get:
      tags: [progress]
      operationId: getGoalSuggestions
      description: >
        Tres sugestoes de meta (leve, constante e intensa) a partir dos ultimos 28 dias: 0,8x, 1x e o percentil 75
        do tempo real por dia estudado, e os dias por semana ao redor do que a pessoa ja faz. Com menos de 3 dias
        de estudo no periodo, vem valores iniciais fixos (based_on_history = false).
      responses:
        "200":
          description: as sugestoes, da mais leve a mais intensa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalSuggestions" }
        "401": { description: sem sessao valida }
  /goals:
    post:
      tags: [progress]
      operationId: startGoal
      description: >
        Abre um novo ciclo de 7 dias a partir de hoje (dia de estudo da pessoa); o ciclo anterior e encerrado,
        cumprido ou nao. "Manter a mesma" e reenviar os mesmos valores. Se ja ha um ciclo aberto hoje, ele e
        substituido.
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalRequest" }
      responses:
        "201":
          description: a meta aberta, com o progresso de hoje
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentGoal" }
        "400": { description: cabecalho de protecao ausente ou meta invalida (minutos, dias ou dias da semana fora dos limites) }
        "401": { description: sem sessao valida }
components:
  responses:
    TooManyRequests:
      description: muitas tentativas; tente de novo depois do tempo de Retry-After
      headers:
        Retry-After: { schema: { type: integer }, description: segundos }
  parameters:
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      description: protecao contra CSRF (so o JavaScript do proprio app envia este cabecalho)
      schema: { type: string, enum: [XMLHttpRequest] }
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: wl_session, description: "com HTTPS o nome real e __Host-wl_session" }
  schemas:
    Me:
      type: object
      required: [id, display_name, role, two_factor_enabled]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        picture_url: { type: string, format: uri, description: "foto de perfil do login social (https); ausente quando nao ha" }
        two_factor_enabled: { type: boolean, description: "se a conta exige 2 fatores para entrar (desligado por padrao)" }
        role: { type: string, enum: [user, admin], description: "so informativo para a interface; a API confere o papel no banco a cada pedido" }
    PasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 1024 }
    LoginProviders:
      type: object
      required: [providers]
      properties:
        providers: { type: array, items: { type: string, enum: [google, github, oidc] } }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        locale: { type: string, enum: [pt-BR, en-US], description: "idioma do e-mail; o padrao e pt-BR" }
    SetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 256, description: "segredo do link (o que vem depois do # do convite, da confirmacao de e-mail ou da recuperacao)" }
        password: { type: string, maxLength: 1024 }
    SetTwoFactorRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    BeginPasskeyRegistrationRequest:
      type: object
      properties:
        invite: { type: string, maxLength: 256, description: "segredo do convite (o que vem depois do # do link)" }
    PasskeyOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true
          description: opcoes WebAuthn em JSON, no formato aceito por PublicKeyCredential.parse...OptionsFromJSON
          x-go-type: json.RawMessage
    FinishPasskeyRegistrationRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: resposta do aparelho (PublicKeyCredential.toJSON())
          x-go-type: json.RawMessage
        name: { type: string, maxLength: 200, description: "nome amigavel da passkey (ex.: Meu celular)" }
    FinishPasskeyLoginRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: object
          additionalProperties: true
          description: resposta do aparelho (PublicKeyCredential.toJSON())
          x-go-type: json.RawMessage
    Passkey:
      type: object
      required: [id, name, created_at, backup_eligible]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        backup_eligible: { type: boolean, description: "passkey que o provedor do aparelho pode sincronizar" }
    Session:
      type: object
      required: [id, created_at, last_used_at, current]
      properties:
        id: { type: string, format: uuid, description: "identificador publico da sessao (nao e o segredo do cookie)" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        user_agent: { type: string }
        current: { type: boolean }
    CatalogUnit:
      type: object
      required: [id, position, theme_key, item_count]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        theme_key: { type: string, description: "chave de traducao do tema; a tela traduz" }
        item_count: { type: integer }
    ItemSummary:
      type: object
      required: [id, kind, term, status]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [word, expression, phrasal_verb, sentence] }
        term: { type: string }
        gloss: { type: string }
        cefr: { type: string, enum: [A1, A2, B1, B2, C1, C2] }
        unit_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, reviewed, published, retired] }
        image_url: { type: string }
    ItemPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ItemSummary" } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    ItemExample:
      type: object
      required: [text]
      properties:
        text: { type: string }
        translation: { type: string }
    ItemImage:
      type: object
      required: [url, credit]
      properties:
        url: { type: string }
        credit: { type: string }
    RelatedItem:
      type: object
      required: [id, term, type]
      properties:
        id: { type: string, format: uuid }
        term: { type: string }
        gloss: { type: string }
        type: { type: string, enum: [collocation, family, synonym, antonym, hypernym, contrast, related] }
    ItemDetail:
      type: object
      required: [id, kind, term, status, examples, images, related]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [word, expression, phrasal_verb, sentence] }
        term: { type: string }
        gloss: { type: string }
        cefr: { type: string, enum: [A1, A2, B1, B2, C1, C2] }
        unit_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, reviewed, published, retired] }
        examples: { type: array, items: { $ref: "#/components/schemas/ItemExample" } }
        images: { type: array, items: { $ref: "#/components/schemas/ItemImage" } }
        related: { type: array, items: { $ref: "#/components/schemas/RelatedItem" } }
    PlanRequest:
      type: object
      required: [minutes]
      properties:
        minutes: { type: integer, enum: [5, 15, 30, 60] }
        mode: { type: string, enum: [review, learn, mixed], default: mixed }
        tz: { type: string, description: "fuso IANA do aparelho (ex.: America/Sao_Paulo); guardado se for valido e a pessoa deixou o fuso acompanhar o aparelho (tz_auto)" }
        locale: { type: string, enum: [pt-BR, en-US], default: pt-BR, description: "idioma da traducao" }
    StudyPack:
      type: object
      required: [session_id, cards, new_limit, review_limit, expires_at]
      properties:
        session_id: { type: string, format: uuid }
        cards: { type: array, items: { $ref: "#/components/schemas/StudyCard" } }
        new_limit: { type: integer, description: "quantas palavras novas cabem hoje" }
        review_limit: { type: integer }
        expires_at: { type: string, format: date-time }
    StudyCard:
      type: object
      required: [id, item_id, direction, state, exercise, term, gloss, mastery]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        direction: { type: string, enum: [receptive, productive] }
        state: { type: string, enum: [new, learning, review, relearning] }
        exercise:
          type: string
          enum: [choose, type, cloze, image, assemble]
          description: >
            escolher (receptivo) ou, no produtivo, digitar a palavra a partir da traducao (type), completar a lacuna da
            frase (cloze), digitar a palavra que a imagem mostra (image) ou montar a frase em ingles com as pecas (assemble,
            so para itens do tipo frase). O servidor escolhe a variante.
        tiles:
          type: array
          items: { type: string }
          description: "so para assemble: as palavras da frase em ingles, embaralhadas (nunca na ordem certa), sem pontuacao; a traducao da frase vem em gloss"
        cloze_text: { type: string, description: "so para cloze: a frase de exemplo com a palavra trocada por ____; a traducao da frase vem em example" }
        term: { type: string, description: "o termo em ingles; no exercicio de digitar nao deve aparecer antes da resposta" }
        gloss: { type: string }
        example: { $ref: "#/components/schemas/ItemExample" }
        image_url: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/ChoiceOption" }, description: "so para escolher: a resposta certa e distratores, em ordem fixa" }
        mastery: { type: number, minimum: 0, maximum: 1, description: "dominio do item (0 a 1)" }
    ChoiceOption:
      type: object
      required: [item_id, gloss]
      properties:
        item_id: { type: string, format: uuid }
        gloss: { type: string }
    ReviewBatch:
      type: object
      required: [reviews]
      properties:
        reviews:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/ReviewInput" }
    ReviewInput:
      type: object
      required: [id, card_id, exercise, shown_at, answered_at]
      properties:
        id: { type: string, format: uuid, description: "gerado no cliente; garante a idempotencia" }
        card_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        exercise: { type: string, enum: [choose, type, cloze, image, assemble], description: "o exercicio que o cartao mostrou; so choose serve ao cartao receptivo, os demais ao produtivo. No assemble, answer traz as pecas na ordem montada, separadas por espaco" }
        source: { type: string, enum: [session, notification, placement, reading], default: session }
        shown_at: { type: string, format: date-time }
        answered_at: { type: string, format: date-time }
        response_ms: { type: integer, minimum: 0 }
        answer: { type: string, maxLength: 200, description: "o que foi digitado (exercicio type)" }
        chosen_item_id: { type: string, format: uuid, description: "o item escolhido (exercicio choose)" }
        client_correct: { type: boolean, description: "o que o app mostrou; so registrado" }
        hint_used: { type: boolean }
        explanation_viewed: { type: boolean }
        image_before_answer: { type: boolean }
        difficulty_suggested: { type: string, enum: [hard, medium, easy] }
        difficulty: { type: string, enum: [hard, medium, easy], description: "so vale quando acertou" }
        error_kind: { type: string, enum: [no_idea, almost, slip], description: "so vale quando errou" }
        device_id: { type: string, format: uuid }
        client_seq: { type: integer }
    ReviewBatchResult:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/ReviewResult" } }
    ReviewResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [applied, duplicate, rejected] }
        reason: { type: string, enum: [card_not_found, invalid_answer, invalid_time], description: "so quando rejected" }
        correct: { type: boolean, description: "a correcao do servidor" }
        typo: { type: boolean }
        grade: { type: integer, minimum: 1, maximum: 4 }
        card: { $ref: "#/components/schemas/CardProgress" }
    CardProgress:
      type: object
      required: [id, state, stability, due_at, lapses, mastery]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [new, learning, review, relearning] }
        stability: { type: number }
        due_at: { type: string, format: date-time }
        lapses: { type: integer }
        mastery: { type: number }
        leech: { type: boolean }
    Credit:
      type: object
      required: [code, name, license, notice]
      properties:
        code: { type: string }
        name: { type: string }
        url: { type: string }
        license: { type: string, description: "identificador SPDX" }
        notice: { type: string, description: "texto de credito exigido pela licenca" }
    Version:
      type: object
      required: [api, commit, env]
      properties:
        api: { type: string, example: "0.1.0" }
        commit: { type: string, example: "a1b2c3d" }
        env: { type: string, example: "tst" }
    Dashboard:
      type: object
      required: [today, streak, studied_today, today_stats, forecast, known_words, most_missed]
      properties:
        today: { type: string, format: date, description: "dia de estudo de hoje (fuso e corte da pessoa)" }
        streak: { type: integer, minimum: 0, description: "dias seguidos com estudo; se hoje ainda nao estudou, ontem nao quebra a sequencia" }
        studied_today: { type: boolean }
        accuracy_7d: { type: number, minimum: 0, maximum: 1, description: "acertos sobre respostas dos ultimos 7 dias; ausente se nao houve resposta" }
        today_stats: { $ref: "#/components/schemas/DayStats" }
        forecast: { type: array, description: "7 dias a partir de hoje; atrasadas contam em hoje", items: { $ref: "#/components/schemas/ForecastDay" } }
        known_words: { type: integer, minimum: 0, description: "lemas com cartao receptivo em revisao e estabilidade de 7 dias ou mais" }
        most_missed: { type: array, items: { $ref: "#/components/schemas/MissedItem" } }
    DayStats:
      type: object
      required: [reviews, correct, new_items, active_seconds]
      properties:
        reviews: { type: integer }
        correct: { type: integer }
        new_items: { type: integer, description: "palavras vistas pela 1a vez" }
        active_seconds: { type: integer }
    ForecastDay:
      type: object
      required: [date, due]
      properties:
        date: { type: string, format: date }
        due: { type: integer, description: "cartoes que vencem no dia" }
    MissedItem:
      type: object
      required: [item_id, term, gloss, misses]
      properties:
        item_id: { type: string, format: uuid }
        term: { type: string }
        gloss: { type: string }
        misses: { type: integer, description: "erros nos ultimos 30 dias (erro de digitacao de 1 letra nao conta)" }
    Heatmap:
      type: object
      required: [from, to, days]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: array, items: { $ref: "#/components/schemas/HeatmapDay" } }
    HeatmapDay:
      type: object
      required: [date, reviews, correct]
      properties:
        date: { type: string, format: date }
        reviews: { type: integer }
        correct: { type: integer }
    GoalRequest:
      type: object
      required: [daily_minutes, days_target]
      properties:
        preset: { type: string, enum: [light, steady, intense, custom], description: "ausente = custom" }
        daily_minutes: { type: integer, minimum: 1, maximum: 240 }
        days_target: { type: integer, minimum: 1, maximum: 7, description: "dias de estudo por ciclo" }
        weekdays: { type: array, description: "dias da semana permitidos, 1 = segunda a 7 = domingo; ausente = todos", items: { type: integer, minimum: 1, maximum: 7 } }
    Goal:
      type: object
      required: [id, period_start, period_end, daily_minutes, days_target, weekdays]
      properties:
        id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        preset: { type: string, enum: [light, steady, intense, custom] }
        daily_minutes: { type: integer }
        days_target: { type: integer }
        weekdays: { type: array, items: { type: integer } }
    GoalProgress:
      type: object
      required: [days_studied, days_target, minutes_studied, minutes_goal, new_words, days_left, met]
      properties:
        days_studied: { type: integer, description: "dias do ciclo com ao menos 1 resposta" }
        days_target: { type: integer }
        minutes_studied: { type: integer, description: "tempo ativo no ciclo, em minutos" }
        minutes_goal: { type: integer, description: "daily_minutes x days_target" }
        new_words: { type: integer, description: "palavras vistas pela 1a vez no ciclo" }
        days_left: { type: integer, minimum: 0, description: "dias que faltam para o fim do ciclo (0 no ultimo dia ou depois)" }
        met: { type: boolean, description: "dias estudados >= dias da meta" }
    CurrentGoal:
      type: object
      required: [ended]
      properties:
        goal: { $ref: "#/components/schemas/Goal" }
        progress: { $ref: "#/components/schemas/GoalProgress" }
        ended: { type: boolean, description: "o ciclo ja acabou: mostrar a retrospectiva e perguntar a proxima meta" }
    GoalSuggestion:
      type: object
      required: [preset, daily_minutes, days_target]
      properties:
        preset: { type: string, enum: [light, steady, intense] }
        daily_minutes: { type: integer }
        days_target: { type: integer }
    GoalSuggestions:
      type: object
      required: [suggestions, based_on_history]
      properties:
        suggestions: { type: array, items: { $ref: "#/components/schemas/GoalSuggestion" } }
        based_on_history: { type: boolean }
    Settings:
      type: object
      required: [ui_locale, theme, tz, tz_auto]
      properties:
        ui_locale: { type: string, enum: [system, pt-BR, en-US], description: "idioma da interface; system = o do aparelho" }
        theme: { type: string, enum: [system, light, dark] }
        tz: { type: string, description: "fuso IANA (ex.: America/Sao_Paulo)" }
        tz_auto: { type: boolean, description: "o fuso acompanha o aparelho" }
    ExportData:
      type: object
      additionalProperties: true
      description: >
        Chaves: schema_version, generated_at, profile, logins, passkeys, sessions, preferences, goals, study_days,
        study_sessions, cards, reviews.
    EraseRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, description: "o e-mail da conta, digitado pela pessoa (sem diferenciar maiusculas)" }