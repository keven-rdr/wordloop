version: "2"
linters:
  default: none
  enable: [govet, errcheck, staticcheck, funlen, cyclop, depguard, gosec]
  settings:
    funlen: { lines: 40, statements: -1 }
    cyclop: { max-complexity: 10 }
    depguard:
      rules:
        # A camada HTTP nao conhece o driver do banco: passa por um caso de uso.
        http-sem-pgx:
          files: ["**/internal/api/*.go", "!$test"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: "a camada HTTP nao acessa o banco; passe por um caso de uso"
  exclusions:
    paths: ["internal/api/gen"]
    rules:
      - path: _test\.go
        linters: [funlen, cyclop]
      - path: ^scripts/
        linters: [gosec] # ferramenta de dev, le so o proprio repositorio
