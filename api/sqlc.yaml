version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/identity/adapters/postgres/queries
    gen:
      go:
        package: db
        out: internal/identity/adapters/postgres/db
        sql_package: pgx/v5
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
  - engine: postgresql
    schema: migrations
    queries: internal/catalog/adapters/postgres/queries
    gen:
      go:
        package: db
        out: internal/catalog/adapters/postgres/db
        sql_package: pgx/v5
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
