version: 3
allow:
  depOnAnyVendor: true
  deepScan: false          # so imports (a analise profunda deu falso positivo no Sprint 0a)
workdir: internal
excludeFiles:
  - "^.*_test\\.go$"       # testes externos (package x_test) importam o proprio pacote
  - "^.*/gen/.*$"
  - "^.*/postgres/db/.*$"  # codigo gerado pelo sqlc
components:
  api:      { in: api }
  apigen:   { in: api/gen }
  platform: { in: [platform/httpx, platform/seal, platform/token, platform/ratelimit, platform/password, platform/mail, platform/db, platform/db/dbtest, platform/version] }
  lrn-domain:   { in: learning/domain }
  lrn-app:      { in: learning/app }
  lrn-adapters: { in: [learning/adapters/http, learning/adapters/postgres] }
  lrn-sqlc:     { in: learning/adapters/postgres/db }   # gerado pelo sqlc
  lrn-test:     { in: learning/learningtest }           # fakes em memoria, so para testes
  srs:      { in: srs }   # biblioteca pura de repeticao espacada: so a biblioteca padrao
  srs-sim:  { in: srs/sim }   # simulador de alunos virtuais: so para testes e relatorios
  contract: { in: ../openapi }   # openapi.yaml embutido (go:embed so alcanca a propria pasta)
  id-domain:   { in: identity/domain }
  id-app:      { in: identity/app }
  id-accounts: { in: identity/accounts }
  id-passkeys: { in: identity/passkeys }
  id-passwords: { in: identity/passwords }
  id-registration: { in: identity/registration }
  id-adapters: { in: [identity/adapters/http, identity/adapters/oidc, identity/adapters/postgres, identity/adapters/webauthn, identity/adapters/github] }
  id-sqlc:     { in: identity/adapters/postgres/db }   # gerado pelo sqlc
  id-test:     { in: identity/identitytest }           # fakes em memoria, so para testes
  cat-domain:   { in: catalog/domain }
  cat-app:      { in: catalog/app }
  cat-adapters: { in: [catalog/adapters/http, catalog/adapters/postgres] }
  cat-sqlc:     { in: catalog/adapters/postgres/db }   # gerado pelo sqlc
  cat-test:     { in: catalog/catalogtest }            # fakes em memoria, so para testes
deps:
  api:      { mayDependOn: [apigen, platform, contract], anyVendorDeps: true }
  apigen:   { anyVendorDeps: true }
  platform: { anyVendorDeps: true }
  contract: { anyVendorDeps: true }
  lrn-domain:   { mayDependOn: [srs], anyVendorDeps: true }
  lrn-app:      { mayDependOn: [lrn-domain, srs, platform], anyVendorDeps: true }
  lrn-adapters: { mayDependOn: [lrn-domain, lrn-app, lrn-sqlc, srs, apigen, platform], anyVendorDeps: true }
  lrn-sqlc:     { anyVendorDeps: true }
  lrn-test:     { mayDependOn: [lrn-domain, lrn-app, srs], anyVendorDeps: true }
  srs-sim:  { mayDependOn: [srs], anyVendorDeps: true }
  srs:      { anyVendorDeps: true }   # so importa a biblioteca padrao (a regra de componentes impede importar modulos)
  id-domain:   { anyVendorDeps: true }
  id-app:      { mayDependOn: [id-domain, platform], anyVendorDeps: true }
  id-accounts: { mayDependOn: [id-domain, platform], anyVendorDeps: true }
  id-passkeys: { mayDependOn: [id-domain, id-app, platform], anyVendorDeps: true }
  id-passwords: { mayDependOn: [id-domain, id-app, platform], anyVendorDeps: true }
  id-registration: { mayDependOn: [id-domain, id-accounts, platform], anyVendorDeps: true }
  id-adapters: { mayDependOn: [id-domain, id-app, id-accounts, id-passkeys, id-passwords, id-registration, id-sqlc, apigen, platform], anyVendorDeps: true }
  id-sqlc:     { anyVendorDeps: true }
  id-test:     { mayDependOn: [id-domain, id-app, id-passkeys, id-passwords, id-registration, platform], anyVendorDeps: true }
  cat-domain:   { anyVendorDeps: true }
  cat-app:      { mayDependOn: [cat-domain, platform], anyVendorDeps: true }
  cat-adapters: { mayDependOn: [cat-domain, cat-app, cat-sqlc, apigen, platform], anyVendorDeps: true }
  cat-sqlc:     { anyVendorDeps: true }
  cat-test:     { mayDependOn: [cat-domain, cat-app], anyVendorDeps: true }
